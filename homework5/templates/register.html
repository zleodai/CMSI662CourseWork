{% extends "base.html" %}
{% set title = "Register | Crystal Vault" %}

{% block content %}
<section class="auth-panel">
  <div>
    <p class="eyebrow">New vault</p>
    <h1>Create your account</h1>
    <p class="lede">Start with one crystal vault and 500 welcome crystals.</p>
  </div>

  {% if error %}
  <p class="alert">{{ error }}</p>
  {% endif %}

  <form class="form-stack" method="post" action="{{ url_for('register') }}">
    {# prevents csrf with token #}
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>
      Name
      <input type="text" name="name" value="{{ values.name or '' }}" autocomplete="name" required>
    </label>
    <label>
      Email
      <input type="text" name="email" inputmode="email" value="{{ values.email or '' }}" autocomplete="username" required>
    </label>
    <label>
      Password
      <input type="password" name="password" autocomplete="new-password" required>
    </label>
    <label>
      Confirm password
      <input type="password" name="confirm_password" autocomplete="new-password" required>
    </label>
    <button type="submit">Create account</button>
  </form>

  <p class="form-note">Already have a vault? <a href="{{ url_for('home') }}">Log in</a>.</p>
</section>
{% endblock %}
